<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOD MAP RolePlay</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0f19;
  --card:#11162a;
  --primary:#7c4dff;
  --secondary:#00e5ff;
  --text:#fff;
  --muted:#a9acc7;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Vazirmatn,sans-serif;
  background:linear-gradient(180deg,#0b0f19,#05070d);
  color:var(--text);
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  background:var(--card);
  padding:40px;
  width:100%;
  max-width:380px;
  border-radius:18px;
  text-align:center;
  border:1px solid rgba(255,255,255,.05);
}

.login-box h1{
  font-family:Orbitron;
  color:var(--primary);
}

.login-box p{
  color:var(--muted);
  margin-bottom:25px;
}

.login-box input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#0c1124;
  color:white;
}

.login-box button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  font-family:Orbitron;
  cursor:pointer;
}

.login-box small{
  display:block;
  margin-top:15px;
  color:#777;
}

/* MAIN SITE */
#site{
  display:none;
}

header{
  padding:60px 20px;
  text-align:center;
}

header h1{
  font-family:Orbitron;
  color:var(--primary);
  font-size:3rem;
}

.ip-box{
  margin-top:20px;
  background:var(--card);
  display:inline-block;
  padding:12px 25px;
  border-radius:12px;
  border:1px solid var(--primary);
  cursor:pointer;
}

section{
  padding:60px 20px;
  max-width:1100px;
  margin:auto;
}

section h2{
  text-align:center;
  font-family:Orbitron;
  color:var(--secondary);
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  margin-top:30px;
}

.card{
  background:var(--card);
  padding:25px;
  border-radius:15px;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

footer{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.logout{
  position:fixed;
  top:20px;
  right:20px;
  background:#ff5252;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

@media(max-width:600px){
  header h1{font-size:2.2rem}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <h1>GOD MAP</h1>
    <p>Login with your Minecraft Username</p>

    <input id="username" placeholder="Minecraft Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>
    <small>RolePlay Server Access</small>
  </div>
</div>

<!-- SITE -->
<div id="site">
<button class="logout" onclick="logout()">Logout</button>

<header>
  <h1>GOD MAP RolePlay</h1>
  <p>Welcome <b id="playerName"></b> 👋</p>

  <div class="ip-box" onclick="copyIP()">
    IP: <span id="serverIP">YOUR_SERVER_IP</span>
  </div>
</header>

<section>
  <h2>🎭 RolePlay System</h2>
  <div class="cards">
    <div class="card">Police, Doctor, Mafia, Business</div>
    <div class="card">Real Economy & Story Mode</div>
    <div class="card">Discord Voice RolePlay</div>
  </div>
</section>

<section style="text-align:center">
  <h2>💬 Discord</h2>
  <br>
  <a style="background:#5865F2;padding:15px 30px;border-radius:12px;color:white;text-decoration:none"
     href="YOUR_DISCORD_LINK" target="_blank">Join Discord</a>
</section>

<footer>
  Developed by <b>Arad</b> & <b>Kourosh</b> © 2025
</footer>
</div>

<script>
function login(){
  const u=document.getElementById("username").value;
  const p=document.getElementById("password").value;
  if(!u||!p) return alert("Fill all fields");
  localStorage.setItem("gm_user",u);
  localStorage.setItem("gm_pass",p);
  loadUser();
}

function loadUser(){
  const u=localStorage.getItem("gm_user");
  if(u){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("site").style.display="block";
    document.getElementById("playerName").innerText=u;
  }
}

function logout(){
  localStorage.clear();
  location.reload();
}

function copyIP(){
  navigator.clipboard.writeText(document.getElementById("serverIP").innerText);
  alert("IP Copied");
}

loadUser();
</script>

</body>
</html>
